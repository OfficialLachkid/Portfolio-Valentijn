<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Document - Valentijn Jacobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Markdown document viewer for the portfolio of Valentijn Jacobs." />

  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #020617;
      --card-bg: #111827;
      --accent: #38bdf8;
      --accent-soft: #0f172a;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    section {
      scroll-margin-top: 110px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Inter", sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #020617 50%);
      color: var(--text-main);
      line-height: 1.7;
      overflow-x: hidden; /* prevent sideways scroll on phones */
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    #markdown-content a {
      color: #38bdf8; /* bright cyan accent */
      text-decoration: underline;
      transition: 0.2s ease;
    }

    #markdown-content a:hover {
      color: #7dd3fc; /* lighter cyan hover */
      text-decoration-thickness: 2px;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0.75rem;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .brand-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #38bdf8, #0ea5e9 40%, #1d4ed8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    nav {
      display: flex;
      gap: 1.25rem;
      font-size: 0.9rem;
    }

    nav a {
      color: var(--text-muted);
      padding: 0.25rem 0.4rem;
      border-radius: 999px;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    nav a:hover {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    main {
      margin-top: 1.5rem;
    }

    .doc-wrapper {
      background: radial-gradient(circle at top, #020617, #020617 55%, #000);
      border-radius: var(--radius-xl);
      padding: 1.75rem 1.75rem 2rem;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
    }

    /* Markdown content styling */

    #markdown-content {
      font-size: 0.97rem;
      color: var(--text-main);
    }

    #markdown-content h1,
    #markdown-content h2,
    #markdown-content h3,
    #markdown-content h4 {
      margin-top: 1.5rem;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    #markdown-content h1 { font-size: 1.6rem; }
    #markdown-content h2 { font-size: 1.35rem; }
    #markdown-content h3 { font-size: 1.15rem; }
    #markdown-content h4 { font-size: 1.05rem; }

    #markdown-content p {
      margin-bottom: 0.7rem;
    }

    #markdown-content ul,
    #markdown-content ol {
      margin: 0.4rem 0 0.9rem 1.4rem;
    }

    #markdown-content li {
      margin-bottom: 0.25rem;
    }

    #markdown-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      background: rgba(15, 23, 42, 0.9);
      padding: 0.1rem 0.25rem;
      border-radius: 4px;
    }

    #markdown-content pre code {
      display: block;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      overflow-x: auto;
    }

    #markdown-content blockquote {
      border-left: 3px solid rgba(148, 163, 184, 0.7);
      margin: 0.9rem 0;
      padding: 0.4rem 0 0.4rem 1rem;
      color: var(--text-muted);
      font-style: italic;
    }

    #markdown-content hr {
      border: none;
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      margin: 1.5rem 0;
    }

    .doc-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding: 0.9rem 1rem;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.65);
    }

    .doc-toolbar p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .doc-toolbar-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .doc-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: #020617;
      color: var(--text-main);
      transition: transform 0.06s ease, box-shadow 0.12s ease,
        background 0.12s ease, border-color 0.12s ease;
    }

    .doc-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.85);
      border-color: rgba(148, 163, 184, 0.9);
    }

    .doc-btn-primary {
      background: radial-gradient(circle at 30% 0%, #38bdf8, #0ea5e9 30%, #1e40af);
      border-color: rgba(56, 189, 248, 0.8);
      color: #020617;
      font-weight: 500;
    }

    .pdf-frame-wrapper {
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(2, 6, 23, 0.95);
      min-height: 75vh;
    }

    .pdf-frame {
      width: 100%;
      height: 75vh;
      border: 0;
      display: block;
      background: #111827;
    }

    .error-msg {
      color: #fca5a5;
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* === ANIMATIONS === */

    .fade-in-up {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .fade-in-up.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      header {
        border-radius: 16px;
      }

      .page {
        padding: 1.25rem 1rem 3rem;
      }
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.6rem;
      }

      nav {
        width: 100%;
        justify-content: flex-start;
        gap: 0.5rem 0.9rem;
        flex-wrap: wrap;
      }

      .page {
        padding: 1.25rem 0.9rem 3rem;
      }

      .doc-wrapper {
        padding: 1.4rem 1.25rem 1.75rem;
      }

      .pdf-frame-wrapper,
      .pdf-frame {
        min-height: 68vh;
        height: 68vh;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="fade-in-up">
      <div class="brand">
        <div class="brand-avatar">VJ</div>
        <div>Valentijn Jacobs</div>
      </div>
      <nav>
        <a href="index.html">Back to portfolio</a>
      </nav>
    </header>

    <main>
      <div class="doc-wrapper fade-in-up">
        <div class="error-msg" id="doc-error" style="display:none;"></div>
        <div id="markdown-content">
          Loading document...
        </div>
      </div>
    </main>

    <footer>
      &copy; <span id="year"></span> VBJ Services
    </footer>
  </div>

  <!-- Markdown converter library -->
  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var yearEl = document.getElementById('year');
      if (yearEl) {
        yearEl.textContent = new Date().getFullYear();
      }

      function getQueryParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      function buildVersionedPath(path) {
        var version = getQueryParam('v');
        if (!version) {
          return path;
        }

        var separator = path.indexOf('?') === -1 ? '?' : '&';
        return path + separator + 'v=' + encodeURIComponent(version);
      }

      function showError(message) {
        errorEl.style.display = 'block';
        errorEl.textContent = message;
        contentEl.textContent = '';
      }

      function renderPdf(filePath, filename) {
        var pdfUrl = buildVersionedPath(filePath);
        var toolbarEl = document.createElement('div');
        toolbarEl.className = 'doc-toolbar';

        var summaryEl = document.createElement('p');
        summaryEl.textContent = 'Previewing ' + filename + '. Use the buttons on the right if the PDF viewer in your browser is stubborn about refreshes.';
        toolbarEl.appendChild(summaryEl);

        var actionsEl = document.createElement('div');
        actionsEl.className = 'doc-toolbar-actions';

        var openEl = document.createElement('a');
        openEl.className = 'doc-btn doc-btn-primary';
        openEl.href = pdfUrl;
        openEl.target = '_blank';
        openEl.rel = 'noopener noreferrer';
        openEl.textContent = 'Open PDF';
        actionsEl.appendChild(openEl);

        var downloadEl = document.createElement('a');
        downloadEl.className = 'doc-btn';
        downloadEl.href = pdfUrl;
        downloadEl.setAttribute('download', filename);
        downloadEl.textContent = 'Download PDF';
        actionsEl.appendChild(downloadEl);

        toolbarEl.appendChild(actionsEl);

        var frameWrapperEl = document.createElement('div');
        frameWrapperEl.className = 'pdf-frame-wrapper';

        var iframeEl = document.createElement('iframe');
        iframeEl.className = 'pdf-frame';
        iframeEl.src = pdfUrl + '#view=FitH';
        iframeEl.title = filename;
        frameWrapperEl.appendChild(iframeEl);

        contentEl.textContent = '';
        contentEl.appendChild(toolbarEl);
        contentEl.appendChild(frameWrapperEl);
      }

      var fileParam = getQueryParam('file');
      var errorEl = document.getElementById('doc-error');
      var contentEl = document.getElementById('markdown-content');

      if (!fileParam) {
        showError('No file specified. Use ?file=Docs/your-file.md or ?file=Docs/your-file.pdf in the URL.');
      } else {
        var parts = fileParam.split('/');
        var filename = parts[parts.length - 1];
        document.title = filename.replace(/_/g, ' ') + ' - Valentijn Jacobs';
        var requestPath = buildVersionedPath(fileParam);

        if (/\.pdf$/i.test(fileParam)) {
          renderPdf(fileParam, filename);
        } else if (/\.md$/i.test(fileParam)) {
          fetch(requestPath)
            .then(function (res) {
              if (!res.ok) {
                throw new Error('Could not load file (' + res.status + ')');
              }
              return res.text();
            })
            .then(function (text) {
              var converter = new showdown.Converter({
                simpleLineBreaks: true,
                tables: true,
                strikethrough: true,
                openLinksInNewWindow: true
              });
              var html = converter.makeHtml(text);
              contentEl.innerHTML = html;
            })
            .catch(function (err) {
              showError('Error loading document: ' + err.message);
            });
        } else {
          showError('Unsupported document type. Use a markdown or PDF file from the Docs folder.');
        }
      }

      var supportsIntersectionObserver = 'IntersectionObserver' in window;
      var prefersReducedMotion = window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var revealObserver = null;

      if (supportsIntersectionObserver && !prefersReducedMotion) {
        revealObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) {
              return;
            }

            entry.target.classList.add('is-visible');
            revealObserver.unobserve(entry.target);
          });
        }, {
          threshold: 0.08,
          rootMargin: '0px 0px -10% 0px'
        });
      }

      function initializeReveal(selector, baseDelay, step, maxDelay) {
        var nodes = document.querySelectorAll(selector);
        Array.prototype.forEach.call(nodes, function (el, index) {
          if (!revealObserver) {
            el.classList.add('is-visible');
            return;
          }

          var delay = Math.min(baseDelay + index * step, maxDelay);
          el.style.transitionDelay = delay + 'ms';
          revealObserver.observe(el);
        });
      }

      initializeReveal('.fade-in-up', 0, 70, 280);
      initializeReveal('.slide-in-left', 90, 85, 360);
    });
  </script>
</body>
</html>
